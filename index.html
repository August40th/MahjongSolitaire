<script>
'use strict';
/* =====================================================================================================
   Mahjong Solitaire - game logic (no drawing, no DOM): layout, free-tile rules, solvable deals, FIND,
   matches counter, quadruples, undo, shuffle. A direct port of the Python version.
   ===================================================================================================== */

const TILE_W = 72;
const TILE_H = 96;
const LAYER_DX = 16;
const LAYER_DY = 18;
const TILE_INSET = 4;
const MAX_IMAGES = 18;

const BG_DEFAULT = 'rgb(255,255,255)';
const BG_SELECTED = 'rgb(255,213,0)';
const BG_MISMATCH = 'rgb(255,56,56)';
const BG_MATCHING = 'rgb(46,214,71)';

const BORDER_DEFAULT = 'rgb(150,140,120)';
const BORDER_SELECTED = 'rgb(176,122,0)';
const BORDER_MISMATCH = 'rgb(170,0,0)';
const BORDER_MATCHING = 'rgb(0,128,20)';

const FLASH_MISMATCH_MS = 750;
const FLASH_MATCH_MS = 320;

const TILE_TYPES = {
  letter: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
  digit: '0123456789'.split(''),
};
const KINDS = ['letter', 'digit'];

const COLORS = {
  red: [190, 40, 40],
  green: [40, 130, 55],
  blue: [30, 90, 190],
  black: [50, 50, 50],
};
const COLOR_ORDER = ['red', 'green', 'blue', 'black'];

const EDITOR_COLS = [0, 16];   // editor grid bounds (x)
const EDITOR_ROWS = [0, 9];    // editor grid bounds (y)
const EDITOR_MAX_LAYER = 4;

function buildExactLayout() {
  const cells = [];
  const rows = { 1: [2, 13], 2: [4, 11], 3: [3, 12], 4: [2, 13], 5: [2, 13], 6: [3, 12], 7: [4, 11], 8: [2, 13] };
  for (const row of Object.keys(rows)) {
    const [c0, c1] = rows[row];
    for (let c = c0; c <= c1; c++) cells.push([c, Number(row), 0]);
  }
  for (const c of [1, 14, 15]) cells.push([c, 4.5, 0]);
  for (let r = 2; r <= 7; r++) for (let c = 5; c <= 10; c++) cells.push([c, r, 1]);
  for (let r = 3; r <= 6; r++) for (let c = 6; c <= 9; c++) cells.push([c, r, 2]);
  for (let r = 4; r <= 5; r++) for (let c = 7; c <= 8; c++) cells.push([c, r, 3]);
  cells.push([7.5, 4.5, 4]);
  if (cells.length !== 144) throw new Error('layout must have 144 tiles');
  return cells;
}
const LAYOUTS = { 'Exact Turtle': buildExactLayout };

/* ------------------------------------------------------------------ tile */
class Tile {
  constructor(gx, gy, z, kind, value, color) {
    this.gx = +gx;
    this.gy = +gy;
    this.z = z | 0;
    this.kind = kind;
    this.value = value;
    this.color = color;
    this.visible = true;
    this.selected = false;
    this.free = false;
    this.removing = false;          // true during the green "matched" flash
    this.customSurface = null;
    this.bg = BG_DEFAULT;
    this.border = BORDER_DEFAULT;
    this.borderWidth = 2;
  }
  setState(bg, border, width) { this.bg = bg; this.border = border; this.borderWidth = width; }
  clearState() { this.setState(BG_DEFAULT, BORDER_DEFAULT, 2); }
}

/* ------------------------------------------------------------------ game core */
class GameCore {
  constructor(opts = {}) {
    this.now = opts.now || (() => performance.now());
    this.rand = opts.rand || Math.random;
    this.WIDTH = opts.width || 1280;
    this.HEIGHT = opts.height || 720;

    this.layoutName = 'Exact Turtle';
    this.tiles = [];
    this.selected = null;
    this.won = false;

    this.customTs = { letter: {}, digit: {} };      // kind -> value -> { surface }

    this.scale = 1;
    this.offsetX = 0;
    this.offsetY = 0;
    this.originGx = 0;
    this.originGy = 0;
    this.boardW = 0;
    this.boardH = 0;

    this.layoutData = null;
    this.layoutEdited = false;

    this.matchHistory = [];
    this.highlightPair = [];
    this.findIndex = 0;
    this.findAnchor = null;         // tile FIND is pairing others with
    this.findLastAnchor = null;
    this.quadValues = new Set();    // "kind|value" with all four tiles free
    this.pending = [];
    this.locked = false;

    this.notification = null;
    this.notificationTime = 0;
  }

  /* ---------------------------------------------------------- helpers */
  shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(this.rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  notify(message) {
    this.notification = message;
    this.notificationTime = this.now();
  }

  /* ---------------------------------------------------------- dealing */
  getCells() {
    const raw = (this.layoutEdited && this.layoutData && this.layoutData.length)
      ? this.layoutData : LAYOUTS[this.layoutName]();
    return raw.map(c => [+c[0], +c[1], c[2] | 0]);
  }

  makePairs(n) {
    const base = [];
    for (const kind of KINDS) {
      for (const v of TILE_TYPES[kind]) {
        base.push([[kind, v, 'red'], [kind, v, 'green']]);
        base.push([[kind, v, 'blue'], [kind, v, 'black']]);
      }
    }
    let pairs = [];
    while (pairs.length < n) pairs = pairs.concat(this.shuffle(base.slice()));
    return pairs.slice(0, n);
  }

  /* Give the tiles faces so the board is guaranteed solvable: simulate removing free tiles two at a time,
     and give each removed pair one matching pair of faces. Replaying that order clears the board. */
  dealSolvable(tiles, pairs, attempts = 300) {
    for (let a = 0; a < attempts; a++) {
      for (const t of tiles) t.visible = true;
      const order = [];
      let ok = true;
      for (let p = 0; p < pairs.length; p++) {
        this.updateFree();
        const free = tiles.filter(t => t.visible && t.free);
        if (free.length < 2) { ok = false; break; }
        const i = Math.floor(this.rand() * free.length);
        let j = Math.floor(this.rand() * (free.length - 1));
        if (j >= i) j++;
        free[i].visible = false;
        free[j].visible = false;
        order.push([free[i], free[j]]);
      }
      if (ok) {
        for (let k = 0; k < order.length; k++) {
          const [x, y] = order[k];
          const [fa, fb] = pairs[k];
          x.kind = fa[0]; x.value = fa[1]; x.color = fa[2];
          y.kind = fb[0]; y.value = fb[1]; y.color = fb[2];
        }
        for (const t of tiles) t.visible = true;
        return true;
      }
    }
    for (const t of tiles) t.visible = true;
    return false;
  }

  resetFindState() {
    this.findIndex = 0;
    this.findAnchor = null;
    this.findLastAnchor = null;
  }

  applyFace(tile) {
    const c = (this.customTs[tile.kind] || {})[tile.value];
    tile.customSurface = c && c.surface ? c.surface : null;
  }

  newDeal() {
    this.won = false;
    this.selected = null;
    this.matchHistory = [];
    this.highlightPair = [];
    this.resetFindState();
    this.pending = [];
    this.locked = false;
    this.quadValues = new Set();

    let cells = this.getCells();
    if (cells.length % 2) {
      cells = cells.slice(0, -1);
      this.notify('Layout had an odd tile count - one tile dropped');
    }
    if (cells.length < 2) {
      this.tiles = [];
      this.notify('Layout has too few tiles');
      return;
    }

    this.tiles = cells.map(([gx, gy, z]) => new Tile(gx, gy, z, 'letter', 'A', 'red'));
    const pairs = this.makePairs(cells.length / 2);

    if (!this.dealSolvable(this.tiles, pairs)) {
      const faces = [].concat(...pairs.map(p => [p[0], p[1]]));
      this.shuffle(faces);
      this.tiles.forEach((t, i) => { [t.kind, t.value, t.color] = faces[i]; });
      this.notify('Could not guarantee a solvable deal - dealt randomly');
    }

    for (const t of this.tiles) {
      t.visible = true;
      t.clearState();
      this.applyFace(t);
    }

    this.recalculateView();
    this.updateFree();
    this.refreshQuads();
  }

  /* ---------------------------------------------------------- geometry */
  setView(minGx, maxGx, minGy, maxGy, maxZ) {
    const boardW = (maxGx - minGx + 1) * TILE_W + maxZ * LAYER_DX;
    const boardH = (maxGy - minGy + 1) * TILE_H + maxZ * LAYER_DY;
    const topMargin = 115;
    const bottomMargin = 135;
    const availW = this.WIDTH - 100;
    const availH = this.HEIGHT - topMargin - bottomMargin;
    this.scale = Math.min(1.0, availW / boardW, availH / boardH);
    this.boardW = boardW * this.scale;
    this.boardH = boardH * this.scale;
    this.originGx = minGx;
    this.originGy = minGy;
    this.offsetX = (this.WIDTH - this.boardW) / 2;
    this.offsetY = topMargin + (availH - this.boardH) / 2;
  }

  recalculateView() {
    let cells = this.tiles.map(t => [t.gx, t.gy, t.z]);
    if (!cells.length) cells = this.getCells();
    if (!cells.length) return;
    this.setView(Math.min(...cells.map(c => c[0])), Math.max(...cells.map(c => c[0])),
                 Math.min(...cells.map(c => c[1])), Math.max(...cells.map(c => c[1])),
                 Math.max(...cells.map(c => c[2])));
  }

  cellRect(gx, gy, z) {
    const s = this.scale;
    const x = this.offsetX + (gx - this.originGx) * TILE_W * s + z * LAYER_DX * s;
    const y = this.offsetY + (gy - this.originGy) * TILE_H * s - z * LAYER_DY * s;
    return { x: Math.trunc(x), y: Math.trunc(y),
             w: Math.trunc((TILE_W - TILE_INSET) * s), h: Math.trunc((TILE_H - TILE_INSET) * s) };
  }

  tileRect(t) { return this.cellRect(t.gx, t.gy, t.z); }

  tileAt(px, py) {
    const order = this.tiles.slice().sort((a, b) => (b.z - a.z) || (b.gy - a.gy) || (b.gx - a.gx));
    for (const t of order) {
      if (!t.visible) continue;
      const r = this.tileRect(t);
      if (px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h) return t;
    }
    return null;
  }

  /* ---------------------------------------------------------- rules */
  /* A tile is free if nothing sits on top of it AND it is not blocked on both its left and right.
     Positions are compared in half-cell units so the half-row side tiles (the turtle's "ears") block
     correctly. */
  updateFree() {
    const key = (z, kx, ky) => ((z + 8) * 1024 + (kx + 512)) * 1024 + (ky + 512);
    const occ = new Set();
    let maxZ = 0;
    for (const t of this.tiles) {
      if (t.visible) {
        occ.add(key(t.z, Math.round(t.gx * 2), Math.round(t.gy * 2)));
        if (t.z > maxZ) maxZ = t.z;
      }
    }
    for (const t of this.tiles) {
      if (!t.visible) { t.free = false; continue; }
      const kx = Math.round(t.gx * 2);
      const ky = Math.round(t.gy * 2);
      let covered = false;
      for (let z = t.z + 1; z <= maxZ && !covered; z++) {
        for (let dx = -1; dx <= 1 && !covered; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (occ.has(key(z, kx + dx, ky + dy))) { covered = true; break; }
          }
        }
      }
      if (covered) { t.free = false; continue; }
      let left = false, right = false;
      for (let dy = -1; dy <= 1; dy++) {
        if (occ.has(key(t.z, kx - 2, ky + dy))) left = true;
        if (occ.has(key(t.z, kx + 2, ky + dy))) right = true;
      }
      t.free = !(left && right);
    }
  }

  canMatch(a, b) {
    if (a === b) return false;
    return a.kind === b.kind && a.value === b.value;
  }

  freeTiles() { return this.tiles.filter(t => t.visible && t.free); }

  allPairs() {
    const free = this.freeTiles();
    const out = [];
    for (let i = 0; i < free.length; i++) {
      for (let j = i + 1; j < free.length; j++) {
        if (this.canMatch(free[i], free[j])) out.push([free[i], free[j]]);
      }
    }
    return out;
  }

  findPair() {
    const free = this.freeTiles();
    for (let i = 0; i < free.length; i++) {
      for (let j = i + 1; j < free.length; j++) {
        if (this.canMatch(free[i], free[j])) return [free[i], free[j]];
      }
    }
    return null;
  }

  /* Number of distinct matching pairs among the free tiles right now - exactly the number of presses FIND
     needs to cycle through every match and come back to the first one (4 free copies = 6 pairs).
     Tiles already matched and mid-flash ("removing") are not counted. */
  countMoves() {
    const groups = new Map();
    for (const t of this.tiles) {
      if (t.visible && t.free && !t.removing) {
        const k = t.kind + '|' + t.value;
        groups.set(k, (groups.get(k) || 0) + 1);
      }
    }
    let total = 0;
    for (const n of groups.values()) total += n * (n - 1) / 2;
    return total;
  }

  /* Face values whose four tiles are ALL free right now. */
  quadSet() {
    const groups = new Map();
    for (const t of this.tiles) {
      if (t.visible && t.free && !t.removing) {
        const k = t.kind + '|' + t.value;
        groups.set(k, (groups.get(k) || 0) + 1);
      }
    }
    const out = new Set();
    for (const [k, n] of groups) if (n >= 4) out.add(k);
    return out;
  }

  refreshQuads() { this.quadValues = this.quadSet(); }

  /* ---------------------------------------------------------- scheduling */
  schedule(delayMs, fn) { this.pending.push([this.now() + delayMs, fn]); }

  processPending() {
    if (!this.pending.length) return;
    const now = this.now();
    const due = this.pending.filter(it => it[0] <= now);
    this.pending = this.pending.filter(it => it[0] > now);
    for (const it of due) it[1]();
  }

  /* ---------------------------------------------------------- actions */
  clearSelection() {
    if (this.selected) {
      this.selected.selected = false;
      this.selected.clearState();
      this.selected = null;
    }
  }

  clearHighlight() {
    for (const t of this.highlightPair) { t.selected = false; t.clearState(); }
    this.highlightPair = [];
  }

  /* FIND with a tile selected: highlight that tile plus a free match for it (press again to cycle through
     its other free matches). FIND with nothing selected: highlight a matching pair (press again for the
     next one). Click a highlighted tile to remove the pair. */
  findMove() {
    if (this.locked || !this.canPlay()) return;

    let anchor = this.selected;
    const fromSelection = anchor !== null;
    if (anchor === null && this.findAnchor !== null && this.highlightPair.includes(this.findAnchor)) {
      anchor = this.findAnchor;           // keep cycling around the same tile
    }

    this.clearHighlight();                // old yellow tiles go back to white
    if (fromSelection) {
      anchor.selected = false;
      anchor.clearState();
      this.selected = null;
    }

    let pair, message;
    if (anchor !== null) {
      const partners = this.freeTiles().filter(t => this.canMatch(anchor, t));
      if (!partners.length) {
        // Nothing to pair with: the tile is deselected and flashes red, then goes back to plain white.
        this.findAnchor = null;
        anchor.selected = false;
        anchor.setState(BG_MISMATCH, BORDER_MISMATCH, 4);
        const restore = () => {
          if (anchor.visible && anchor.bg === BG_MISMATCH && anchor !== this.selected) anchor.clearState();
        };
        this.schedule(FLASH_MISMATCH_MS, restore);
        this.notify('No free match for ' + anchor.value + ' right now');
        return;
      }
      if (anchor !== this.findLastAnchor) this.findIndex = 0;
      this.findLastAnchor = anchor;
      this.findAnchor = anchor;
      const pos = this.findIndex % partners.length;
      pair = [anchor, partners[pos]];
      message = 'Match for ' + anchor.value + ' highlighted (option ' + (pos + 1) + ' of ' +
                partners.length + ') - click to remove';
    } else {
      const pairs = this.allPairs();
      if (!pairs.length) { this.notify('No moves left - try SHUFFLE'); return; }
      if (this.findLastAnchor !== null) this.findIndex = 0;
      this.findLastAnchor = null;
      this.findAnchor = null;
      pair = pairs[this.findIndex % pairs.length];
      message = 'Match highlighted - click one of them to remove';
    }

    this.findIndex += 1;
    for (const t of pair) { t.selected = true; t.setState(BG_SELECTED, BORDER_SELECTED, 4); }
    this.highlightPair = pair.slice();
    this.notify(message);
  }

  undoMove() {
    if (this.locked || !this.canPlay()) return;
    if (!this.matchHistory.length) { this.notify('Nothing to undo'); return; }
    this.clearSelection();
    this.clearHighlight();
    for (const t of this.matchHistory.pop()) {
      t.visible = true;
      t.selected = false;
      t.removing = false;
      t.clearState();
    }
    this.won = false;
    this.resetFindState();
    this.updateFree();
    this.refreshQuads();
    this.notify('Undone');
  }

  reshuffle() {
    if (this.locked || !this.canPlay()) return;
    this.clearSelection();
    this.clearHighlight();

    const visible = this.tiles.filter(t => t.visible);
    if (visible.length < 2) { this.notify('Not enough tiles to shuffle'); return; }

    // Rebuild matching pairs from the faces still on the board.
    const groups = new Map();
    for (const t of visible) {
      const k = t.kind + '|' + t.value;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push([t.kind, t.value, t.color]);
    }
    const pairs = [];
    const leftovers = [];
    for (const faces of groups.values()) {
      this.shuffle(faces);
      while (faces.length >= 2) pairs.push([faces.pop(), faces.pop()]);
      leftovers.push(...faces);
    }

    let done = false;
    if (!leftovers.length) done = this.dealSolvable(visible, pairs, 200);

    if (!done) {
      const faces = visible.map(t => [t.kind, t.value, t.color]);
      for (let i = 0; i < 200; i++) {
        this.shuffle(faces);
        visible.forEach((t, j) => { [t.kind, t.value, t.color] = faces[j]; });
        this.updateFree();
        if (this.findPair() !== null) { done = true; break; }
      }
    }

    for (const t of visible) { t.visible = true; this.applyFace(t); }

    this.resetFindState();
    this.updateFree();
    this.refreshQuads();
    this.notify(done ? 'Shuffled' : 'Shuffled - no matching moves possible');
  }

  finishMatch(t1, t2) {
    this.matchHistory.push([t1, t2]);
    for (const t of [t1, t2]) {
      t.visible = false;
      t.selected = false;
      t.removing = false;
      t.clearState();
    }
    this.locked = false;
    this.resetFindState();

    this.updateFree();
    this.refreshQuads();

    if (!this.tiles.some(t => t.visible)) {
      this.won = true;
      this.notify('Board cleared!');
    } else if (this.findPair() === null) {
      this.notify('No moves left - use UNDO or SHUFFLE');
    }
  }

  flashMismatch(t1, t2) {
    for (const t of [t1, t2]) {
      t.selected = false;
      t.setState(BG_MISMATCH, BORDER_MISMATCH, 4);
    }
    this.locked = true;
    this.schedule(FLASH_MISMATCH_MS, () => {
      for (const t of [t1, t2]) t.clearState();
      this.locked = false;
    });
  }

  /* ---------------------------------------------------------- clicking */
  clickTile(tile) {
    if (this.locked) return;

    // Clicking a FIND-highlighted tile removes the highlighted pair.
    if (this.highlightPair.includes(tile)) {
      const other = this.highlightPair[0] === tile ? this.highlightPair[1] : this.highlightPair[0];
      this.clearHighlight();
      this.finishMatch(tile, other);
      return;
    }

    // Clicking anything else clears the highlight (tiles go white).
    if (this.highlightPair.length) this.clearHighlight();

    if (!tile.free) { this.notify('That tile is blocked.'); return; }

    if (this.selected === tile) {
      tile.selected = false;
      tile.clearState();
      this.selected = null;
      return;
    }

    if (this.selected === null) {
      tile.selected = true;
      tile.setState(BG_SELECTED, BORDER_SELECTED, 4);
      this.selected = tile;
      return;
    }

    const first = this.selected;
    if (this.canMatch(first, tile)) {
      first.selected = false;
      first.removing = true;
      tile.removing = true;
      first.setState(BG_MATCHING, BORDER_MATCHING, 4);
      tile.setState(BG_MATCHING, BORDER_MATCHING, 4);
      this.selected = null;
      this.locked = true;
      this.schedule(FLASH_MATCH_MS, () => this.finishMatch(first, tile));
    } else {
      this.selected = null;
      this.flashMismatch(first, tile);
    }
  }

  /* The UI overrides this: game actions only work on the game screen. */
  canPlay() { return true; }
}

if (typeof module !== 'undefined') {
  module.exports = { GameCore, Tile, buildExactLayout, LAYOUTS, TILE_TYPES, KINDS, COLORS, COLOR_ORDER,
                     BG_DEFAULT, BG_SELECTED, BG_MISMATCH, BG_MATCHING, FLASH_MATCH_MS, FLASH_MISMATCH_MS,
                     TILE_W, TILE_H, TILE_INSET, EDITOR_COLS, EDITOR_ROWS, EDITOR_MAX_LAYER, MAX_IMAGES };
}
'use strict';
/* =====================================================================================================
   AMBIENT MUSIC (from Rainbow Runner): a never-ending, randomly composed sequence on the five black keys
   of a piano. Everything is synthesised here (no sound files). A direct port of the Python engine:
     - MusicCommon():  the shared engine code (settings, note synthesis, composer, mixer, effects)
     - a Web Worker builds the notes in the background,
     - an AudioWorklet composes, mixes and applies phaser / flanger / echo / reverb in real time,
     - MusicPlayer is what the game talks to (same API as the Python AmbientMusic).
   MusicCommon is a self-contained function so its source can be copied into the worker and the worklet.
   ===================================================================================================== */

function MusicCommon() {
  const MUS_RATE = 22050;                     // samples per second (the engine always runs at this rate)
  const MUS_N = 512;                          // frames per processing block (23 ms)
  const MUS_INSTRUMENTS = ['Piano', 'Koto', 'Steel drum', 'Kalimba'];
  const MUS_DEFAULTS = { on: true, inst: 'Piano', oct_lo: 2, oct_n: 4, density: 10, long: 3, voices: 4, vol: 7,
                         rev_mix: 8, rev_len: 8, dly_mix: 4, dly_time: 7, pha_mix: 9, pha_rate: 8,
                         fla_mix: 10, fla_rate: 8 };
  const MUS_LIMITS = { oct_lo: [1, 6], oct_n: [1, 4], density: [1, 15], long: [0, 10], voices: [1, 4],
                       vol: [0, 10], rev_mix: [0, 10], rev_len: [1, 10], dly_mix: [0, 10], dly_time: [1, 10],
                       pha_mix: [0, 10], pha_rate: [1, 10], fla_mix: [0, 10], fla_rate: [1, 10] };
  const BLACK_PCS = [1, 3, 6, 8, 10];         // C#  D#  F#  G#  A#
  const NOTE_NAMES = { 1: 'C#', 3: 'D#', 6: 'F#', 8: 'G#', 10: 'A#' };

  /* A complete, valid settings object from whatever was saved. */
  function musicClean(d) {
    const out = Object.assign({}, MUS_DEFAULTS);
    if (d && typeof d === 'object') {
      for (const k of Object.keys(d)) {
        const v = d[k];
        if (k === 'on') out.on = !!v;
        else if (k === 'inst' && MUS_INSTRUMENTS.indexOf(v) >= 0) out.inst = v;
        else if (Object.prototype.hasOwnProperty.call(MUS_LIMITS, k) && typeof v === 'number' && isFinite(v)) {
          out[k] = Math.max(MUS_LIMITS[k][0], Math.min(MUS_LIMITS[k][1], Math.trunc(v)));
        }
      }
    }
    out.oct_lo = Math.min(out.oct_lo, 7 - out.oct_n);
    return out;
  }

  /* Every black-key MIDI note inside the chosen octave range, low to high. */
  function musicPitches(p) {
    const out = [];
    for (let o = p.oct_lo; o < p.oct_lo + p.oct_n; o++) for (const pc of BLACK_PCS) out.push(12 * (o + 1) + pc);
    return out;
  }

  function musicNoteName(m) { return (NOTE_NAMES[m % 12] || '?') + (Math.floor(m / 12) - 1); }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------------------------------------------------------- note synthesis */
  /* A grand piano note, added into buf. What makes it a piano and not a keyboard: every partial is slightly
     stretched (stiff strings), every partial is TWO strings tuned a fraction of a cent apart (they beat and
     shimmer), the sound dies in two stages (a quick "prompt" fall, then a long "after-ring"), higher
     partials die sooner, the hammer strikes a point on the string (some partials are weak), and the felt
     hammer adds a soft thump at the start. */
  function grandPiano(buf, f, midi, ls) {
    const n = buf.length;
    const rnd = mulberry32(midi * 7 + 1);
    const uni = (a, b) => a + (b - a) * rnd();
    const R = MUS_RATE;
    const twoPi = 2.0 * Math.PI;
    const bigB = 0.00012 * Math.exp((midi - 48) / 16.0);                    // string stiffness: stretched partials
    const tau1 = Math.max(0.35, Math.min(4.0, 1.7 * Math.pow(261.6 / f, 0.55))) * ls;   // low notes ring longer
    for (let k = 1; k <= 18; k++) {
      const fk = k * f * Math.sqrt(1.0 + bigB * k * k);
      if (fk > R * 0.45) break;
      const amp = Math.abs(Math.sin(Math.PI * k * 0.12)) / Math.pow(k, 0.75) * Math.exp(-(k - 1) * 0.11);
      if (amp < 0.004) continue;
      const t1 = tau1 / (1.0 + 0.35 * Math.pow(k - 1, 1.1));
      const t2 = t1 * 4.5;
      const m = Math.min(n, Math.floor(R * t2 * 6.0));
      const d1 = Math.exp(-1.0 / (R * t1));
      const d2 = Math.exp(-1.0 / (R * t2));
      const cents = uni(0.3, 0.9) / 1200.0 * Math.log(2.0);
      const wa = twoPi * fk * (1.0 + cents) / R;
      const wb = twoPi * fk * (1.0 - cents) / R;
      const pa = uni(0, twoPi);
      const pb = uni(0, twoPi);
      let e1 = 0.6 * amp * 0.5;
      let e2 = 0.4 * amp * 0.5;
      // two sine oscillators by rotation (much cheaper than a sin() per sample)
      const ca = Math.cos(wa), sa = Math.sin(wa), cb = Math.cos(wb), sb = Math.sin(wb);
      let xa = Math.cos(pa), ya = Math.sin(pa), xb = Math.cos(pb), yb = Math.sin(pb);
      for (let i = 0; i < m; i++) {
        buf[i] += (e1 + e2) * (ya + yb);
        let t = xa * ca - ya * sa; ya = xa * sa + ya * ca; xa = t;
        t = xb * cb - yb * sb; yb = xb * sb + yb * cb; xb = t;
        e1 *= d1;
        e2 *= d2;
        if (e1 + e2 < 1e-7) break;                                          // inaudible from here on
      }
    }
    let lp = 0.0;                                                           // the hammer's felt thump
    const a = Math.min(0.9, 2.0 * Math.PI * Math.min(2500.0, f * 3.0) / R);
    const lim = Math.floor(0.06 * R);
    for (let i = 0; i < lim; i++) {
      lp += a * (uni(-1.0, 1.0) - lp);
      buf[i] += 0.55 * lp * Math.exp(-i / (0.008 * R));
    }
  }

  /* One note of an instrument as mono floats (peak 0.8). Additive synthesis: a handful of partials, each
     with its own decay; `long` stretches every decay so the note rings on. */
  function synthNote(inst, midi, long) {
    const R = MUS_RATE;
    const f = 440.0 * Math.pow(2.0, (midi - 69) / 12.0);
    const secs = long ? 10.0 : 7.0;
    const n = Math.floor(R * secs);
    const ls = long ? 2.6 : 1.0;
    const tl = Math.max(0.55, Math.min(1.6, Math.pow(261.6 / f, 0.35)));    // low notes ring longer
    let bend = 0.0;
    let parts = [];
    if (inst === 'Koto') {
      for (let k = 1; k <= 8; k++) parts.push([k, 1.0 / Math.pow(k, 0.8), 2.0 * tl / Math.pow(k, 0.75)]);
      parts.push([1.004, 0.25, 1.4 * tl]);                                  // a faint second string: slight shimmer
      bend = 0.011;
    } else if (inst === 'Steel drum') {
      parts = [[1.0, 1.0, 2.4 * tl], [1.003, 0.45, 2.1 * tl], [2.0, 0.75, 1.7 * tl], [3.0, 0.38, 1.0 * tl],
               [4.01, 0.20, 0.6 * tl], [5.98, 0.08, 0.35 * tl], [2.76, 0.12, 0.18 * tl]];
    } else if (inst !== 'Piano') {                                          // Kalimba
      parts = [[1.0, 1.0, 2.6 * tl], [2.0, 0.16, 1.1 * tl], [5.4, 0.30, 0.24 * tl], [8.9, 0.09, 0.10 * tl]];
    }
    const buf = new Float64Array(n);
    const twoPi = 2.0 * Math.PI;
    if (inst === 'Piano') grandPiano(buf, f, midi, ls);
    for (const [ratio, amp, tau0] of parts) {
      const fr = f * ratio;
      if (fr > R * 0.45) continue;
      const tau = tau0 * ls;
      const m = Math.min(n, Math.floor(R * tau * 7.0));
      const dec = Math.exp(-1.0 / (R * tau));
      const w = twoPi * fr / R;
      let e = amp;
      if (bend) {
        const tb = 0.06 * R;
        for (let i = 0; i < m; i++) {
          buf[i] += e * Math.sin(w * (i + bend * tb * (1.0 - Math.exp(-i / tb))));
          e *= dec;
        }
      } else {
        for (let i = 0; i < m; i++) {
          buf[i] += e * Math.sin(w * i);
          e *= dec;
        }
      }
    }
    for (let i = 0; i < 80; i++) buf[i] *= i / 80.0;                        // a soft attack: no click
    let peak = 0;
    for (let i = 0; i < n; i++) { const a = Math.abs(buf[i]); if (a > peak) peak = a; }
    if (!peak) peak = 1.0;
    const k = 0.8 / peak;
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) out[i] = buf[i] * k;
    return out;
  }

  const noteKey = (inst, midi, long) => inst + '|' + midi + '|' + (long ? 1 : 0);
  const clamp1 = (v) => (v > 1 ? 1 : (v < -1 ? -1 : v));

  /* ---------------------------------------------------------------- the player's engine */
  /* Composes notes, mixes up to four voices and runs them through phaser, flanger, echo and reverb.
     block() makes 23 ms of stereo audio (512 frames at 22050 Hz). */
  class AmbientEngine {
    constructor(settings, rng) {
      this.p = musicClean(settings);
      this.rng = rng || Math.random;
      this.notes = new Map();
      this.voices = [];
      this.t = 0;                                         // frames rendered so far
      this.nextOn = Math.trunc(0.6 * MUS_RATE);
      this.recent = [];                                   // the last pitches played
      this.tri = [];                                      // recent three-note shapes
      this.ivs = [];                                      // recent intervals
      this.reg = {};                                      // how often each octave was used lately
      this.fade = 0.0;
      this.L = new Float32Array(MUS_N);
      this.R = new Float32Array(MUS_N);
      // effect state
      this.phaPh = 0.0;
      this.phaSt = [new Float64Array(8), new Float64Array(8)];
      this.flaPh = 0.0;
      this.dryL = new Float32Array(2048);
      this.dryR = new Float32Array(2048);
      this.dryN = 0;
      this.echoBuf = new Float32Array(65536);
      this.echoN = 0;
      this.combs = [0, 1].map(() => this.COMB_MS[0].map(() => new Float32Array(4096)));
      this.combN = 0;
      this.COMB_MS_USE = this.COMB_MS;
    }

    get COMB_MS() { return [[24.1, 29.7, 37.1, 41.1, 47.3, 53.9], [25.3, 31.9, 35.3, 43.3, 49.9, 57.1]]; }

    addNote(inst, midi, long, data) { this.notes.set(noteKey(inst, midi, long), data); }
    getNote(inst, midi, long) { return this.notes.get(noteKey(inst, midi, long)); }
    forget(keepInst) { for (const k of Array.from(this.notes.keys())) if (k.split('|')[0] !== keepInst) this.notes.delete(k); }
    reset() { this.voices = []; this.fade = 0.0; }

    /* ----- composing ----- */
    choices(cands, weights) {
      let total = 0;
      for (const w of weights) total += w;
      let r = this.rng() * total;
      for (let i = 0; i < cands.length; i++) { r -= weights[i]; if (r < 0) return cands[i]; }
      return cands[cands.length - 1];
    }

    /* Pick the next pitch: black keys only, not a recent note, spread away from the notes already sounding,
       and never a shape (three notes in a row) that was heard a moment ago. */
    choose() {
      const p = this.p;
      const pits = musicPitches(p).filter(m => this.getNote(p.inst, m, false) !== undefined);
      if (!pits.length) return null;
      const sounding = this.voices.map(v => v.midi);
      const last = this.recent;
      let cands = [], weights = [];
      for (const m of pits) {
        if (last.slice(-4).indexOf(m) >= 0) continue;
        if (last.length && m % 12 === last[last.length - 1] % 12) continue;           // same key, other octave: too alike
        if (last.slice(-5).filter(x => x % 12 === m % 12).length >= 2) continue;
        if (last.length >= 2 && this.tri.some(t => t[0] === last[last.length - 2] && t[1] === last[last.length - 1] && t[2] === m)) continue;
        if (last.length >= 2 && this.ivs.length >= 2 && m - last[last.length - 1] === this.ivs[this.ivs.length - 1] &&
            this.ivs[this.ivs.length - 1] === this.ivs[this.ivs.length - 2]) continue;   // no endless ladders
        let w = 1.0;
        if (sounding.length) {
          const d = Math.min(...sounding.map(s => Math.abs(m - s)));
          w *= d < 3 ? 0.08 : (d < 6 ? 0.5 : 1.0);                                   // keep the voices spread out
        }
        w *= 1.0 / (1.0 + (this.reg[Math.floor(m / 12)] || 0.0));                    // visit every octave
        if (last.length) w *= Math.abs(m - last[last.length - 1]) <= 9 ? 1.0 : 0.6;
        cands.push(m);
        weights.push(w);
      }
      if (!cands.length) {
        const c = pits.filter(m => last.slice(-2).indexOf(m) < 0);
        cands = c.length ? c : pits;
        weights = cands.map(() => 1.0);
      }
      const m = this.choices(cands, weights);
      if (last.length) {
        this.ivs.push(m - last[last.length - 1]);
        if (this.ivs.length > 6) this.ivs.splice(0, this.ivs.length - 6);
      }
      if (last.length >= 2) {
        this.tri.push([last[last.length - 2], last[last.length - 1], m]);
        if (this.tri.length > 24) this.tri.splice(0, this.tri.length - 24);
      }
      last.push(m);
      if (last.length > 12) last.splice(0, last.length - 12);
      for (const k of Object.keys(this.reg)) this.reg[k] *= 0.9;
      const oc = Math.floor(m / 12);
      this.reg[oc] = (this.reg[oc] || 0.0) + 1.0;
      return m;
    }

    /* Average seconds between notes: 9 s at density 1 down to 0.28 s (3.6 notes a second) at 15. */
    meanGap() { return 9.0 * Math.pow(0.78, this.p.density - 1); }

    gap() {
      const mean = this.meanGap();
      let g = mean * (0.35 + Math.min(3.0, -Math.log(1.0 - this.rng())) * 0.65);
      if (this.rng() < 0.10) g *= 0.3;
      return Math.max(0.12, g);
    }

    spawn() {
      const p = this.p, rng = this.rng;
      if (this.voices.length >= p.voices) return false;
      const m = this.choose();
      if (m === null) return false;
      let long = rng() < p.long * 0.1;
      let data = this.getNote(p.inst, m, long);
      if (data === undefined) {
        long = false;
        data = this.getNote(p.inst, m, false);
        if (data === undefined) return false;
      }
      let sf = Math.max(0.15, Math.min(1.0, 0.2 * this.meanGap() * p.voices));      // busy music: shorter notes
      let hold, fade;
      if (long) {
        sf = Math.max(sf, 0.35);
        hold = (6.0 + 2.0 * rng()) * sf; fade = (2.0 + 0.8 * rng()) * sf;
      } else {
        hold = (1.6 + 2.6 * rng()) * sf; fade = (1.0 + 0.8 * rng()) * sf;
      }
      const pits = musicPitches(p);
      const pos = (m - pits[0]) / Math.max(1, pits[pits.length - 1] - pits[0]);
      const pan = Math.max(-0.85, Math.min(0.85, (pos - 0.5) * 0.9 + (-0.3 + 0.6 * rng())));
      const vel = (0.55 + 0.45 * rng()) * (long ? 0.85 : 1.0);
      this.voices.push({ midi: m, buf: data, pos: 0, hold: Math.trunc(hold * MUS_RATE), fade: Math.trunc(fade * MUS_RATE),
                         gl: vel * Math.sqrt((1.0 - pan) / 2.0), gr: vel * Math.sqrt((1.0 + pan) / 2.0) });
      return true;
    }

    /* ----- rendering ----- */
    voicesBlock(L, R) {
      const N = MUS_N;
      L.fill(0); R.fill(0);
      const keep = [];
      for (const v of this.voices) {
        const a = v.pos;
        const buf = v.buf;
        const len = buf.length;
        for (let s = 0; s < 4; s++) {
          const fr = a + s * 128 + 64;
          let g;
          if (fr <= v.hold) g = 1.0;
          else { const x = (fr - v.hold) / v.fade; g = Math.pow(Math.max(0.0, 1.0 - x), 1.5); }
          const fac = g * 0.34;
          for (let j = 0; j < 128; j++) {
            const idx = a + s * 128 + j;
            if (idx >= len) break;
            const m = buf[idx] * fac;
            L[s * 128 + j] += m * v.gl;
            R[s * 128 + j] += m * v.gr;
          }
        }
        v.pos = a + N;
        if (v.pos < Math.min(v.hold + v.fade, len)) keep.push(v);
      }
      this.voices = keep;
      for (let i = 0; i < N; i++) { L[i] = clamp1(L[i]); R[i] = clamp1(R[i]); }
    }

    phaser(L, R, mix) {
      const N = MUS_N;
      const m = mix * 0.1 * 0.6;
      const rate = 0.05 + 0.09 * this.p.pha_rate;
      this.phaPh += 2.0 * Math.PI * rate * N / MUS_RATE;
      const keep = 1.0 - m;
      [L, R].forEach((a, ch) => {
        const lf = 0.5 + 0.5 * Math.sin(this.phaPh + ch * 1.4);
        const fc = 250.0 + 1700.0 * lf * lf;
        const tn = Math.tan(Math.PI * fc / MUS_RATE);
        const c = (tn - 1.0) / (tn + 1.0);
        const st = this.phaSt[ch];
        let x1 = st[0], y1 = st[1], x2 = st[2], y2 = st[3], x3 = st[4], y3 = st[5], x4 = st[6], y4 = st[7];
        for (let i = 0; i < N; i++) {
          const s = a[i];
          let y = c * s + x1 - c * y1;
          x1 = s; y1 = y;
          let z = c * y + x2 - c * y2;
          x2 = y; y2 = z;
          y = c * z + x3 - c * y3;
          x3 = z; y3 = y;
          z = c * y + x4 - c * y4;
          x4 = y; y4 = z;
          a[i] = clamp1(s * keep + z * m);
        }
        st[0] = x1; st[1] = y1; st[2] = x2; st[3] = y2; st[4] = x3; st[5] = y3; st[6] = x4; st[7] = y4;
      });
    }

    pushDry(L, R) {
      const M = 2047;
      for (let i = 0; i < MUS_N; i++) { this.dryL[(this.dryN + i) & M] = L[i]; this.dryR[(this.dryN + i) & M] = R[i]; }
    }

    flanger(L, R, mix) {
      const N = MUS_N;
      this.flaPh += 2.0 * Math.PI * (0.04 + 0.05 * this.p.fla_rate) * N / MUS_RATE;
      const d = Math.trunc(MUS_RATE * (0.0018 + 0.0014 * Math.sin(this.flaPh)));    // 0.4 .. 3.2 ms
      this.pushDry(L, R);                                                           // the dry signal, incl. this block
      const M = 2047;
      const k = mix * 0.1 * 0.45;
      const n0 = this.dryN;
      for (let i = 0; i < N; i++) {
        const j = (n0 + i - d) & M;
        L[i] = clamp1(L[i] * (1.0 - k * 0.5) + this.dryL[j] * k);
        R[i] = clamp1(R[i] * (1.0 - k * 0.5) + this.dryR[j] * k);
      }
    }

    echo(L, R, mix) {
      const N = MUS_N, M = 65535;
      const dl = Math.max(N + 16, Math.trunc(MUS_RATE * (0.12 + 0.075 * this.p.dly_time)));
      const dl2 = Math.trunc(dl * 1.5);
      const n0 = this.echoN;
      const k = mix * 0.1 * 0.8;
      const t1 = new Float32Array(N), t2 = new Float32Array(N);
      for (let i = 0; i < N; i++) { t1[i] = this.echoBuf[(n0 + i - dl) & M]; t2[i] = this.echoBuf[(n0 + i - dl2) & M]; }
      for (let i = 0; i < N; i++) {
        const mono = 0.5 * L[i] + 0.5 * R[i];
        this.echoBuf[(n0 + i) & M] = clamp1(mono + t1[i] * 0.42);
        L[i] = clamp1(L[i] + t1[i] * k);
        R[i] = clamp1(R[i] + t2[i] * k);
      }
      this.echoN += N;
    }

    pushEchoMono(L, R) {
      const N = MUS_N, M = 65535;
      for (let i = 0; i < N; i++) this.echoBuf[(this.echoN + i) & M] = 0.5 * L[i] + 0.5 * R[i];
      this.echoN += N;
    }

    reverb(L, R, mix) {
      const N = MUS_N, M = 4095;
      const g = 0.62 + 0.032 * this.p.rev_len;                                      // feedback: 0.65 .. 0.94
      const n0 = this.combN;
      const mono = new Float32Array(N);
      for (let i = 0; i < N; i++) mono[i] = 0.5 * L[i] + 0.5 * R[i];
      const outs = [new Float32Array(N), new Float32Array(N)];
      for (let side = 0; side < 2; side++) {
        const delays = this.COMB_MS[side];
        for (let j = 0; j < delays.length; j++) {
          const dl = Math.trunc(MUS_RATE * delays[j] / 1000.0);
          const ring = this.combs[side][j];
          const acc = outs[side];
          for (let i = 0; i < N; i++) {
            const lp = 0.5 * ring[(n0 + i - dl) & M] + 0.5 * ring[(n0 + i - dl - 1) & M];   // darker with every pass
            const y = clamp1(mono[i] + g * lp);
            ring[(n0 + i) & M] = y;
            acc[i] = clamp1(acc[i] + y);
          }
        }
      }
      const k = mix * 0.1 * 0.17 * (1.25 - g);
      for (let i = 0; i < N; i++) {
        L[i] = clamp1(L[i] + outs[0][i] * k);
        R[i] = clamp1(R[i] + outs[1][i] * k);
      }
      this.combN += N;
    }

    /* The next 23 ms of the music: 512 stereo frames (floats, -1..1). Returns [left, right]. */
    block() {
      const p = this.p;
      this.t += MUS_N;
      if (this.t >= this.nextOn) {
        if (this.spawn()) this.nextOn = this.t + Math.trunc(this.gap() * MUS_RATE);
        else this.nextOn = this.t + Math.trunc(0.12 * MUS_RATE);
      }
      const L = this.L, R = this.R;
      this.voicesBlock(L, R);
      if (p.pha_mix) this.phaser(L, R, p.pha_mix);
      if (p.fla_mix) this.flanger(L, R, p.fla_mix); else this.pushDry(L, R);
      this.dryN += MUS_N;
      if (p.dly_mix) this.echo(L, R, p.dly_mix); else this.pushEchoMono(L, R);
      this.reverb(L, R, p.rev_mix ? p.rev_mix : 0.0);
      const vol = Math.pow(p.vol / 10.0, 2) * 3.0;
      this.fade = Math.min(1.0, this.fade + MUS_N / (2.0 * MUS_RATE));
      const gain = vol * this.fade;
      for (let i = 0; i < MUS_N; i++) { L[i] = clamp1(L[i] * gain); R[i] = clamp1(R[i] * gain); }
      return [L, R];
    }

    /* Offline: seconds of music as two Float32Arrays (used by tests). */
    render(seconds) {
      const blocks = Math.floor(seconds * MUS_RATE / MUS_N);
      const L = new Float32Array(blocks * MUS_N), R = new Float32Array(blocks * MUS_N);
      for (let b = 0; b < blocks; b++) {
        const [l, r] = this.block();
        L.set(l, b * MUS_N); R.set(r, b * MUS_N);
      }
      return [L, R];
    }
  }

  return { MUS_RATE, MUS_N, MUS_INSTRUMENTS, MUS_DEFAULTS, MUS_LIMITS, BLACK_PCS, NOTE_NAMES, musicClean,
           musicPitches, musicNoteName, mulberry32, synthNote, noteKey, AmbientEngine };
}

/* ---------------------------------------------------------------- Web Worker: builds the notes */
function musicWorkerMain(C) {
  let queue = [];
  let busy = false;
  async function run() {
    busy = true;
    while (queue.length) {
      const [inst, midi, long] = queue.shift();
      let data = null;
      try { data = C.synthNote(inst, midi, long); } catch (e) { data = null; }
      if (data) postMessage({ inst, midi, long, data }, [data.buffer]);
      await new Promise(r => setTimeout(r, 0));               // let a new "want" message in
    }
    busy = false;
  }
  onmessage = (e) => {
    if (e.data && e.data.cmd === 'want') { queue = e.data.keys.slice(); if (!busy) run(); }
  };
}

/* ---------------------------------------------------------------- AudioWorklet: the real-time engine */
function musicWorkletMain(C) {
  class MahjongMusic extends AudioWorkletProcessor {
    constructor(options) {
      super();
      const po = (options && options.processorOptions) || {};
      this.engine = new C.AmbientEngine(po.p);
      this.running = false;
      this.CAP = 8192;
      this.fl = new Float32Array(this.CAP);
      this.fr = new Float32Array(this.CAP);
      this.wi = 0;                                   // engine frames produced so far
      this.rp = 0;                                   // read position (engine frames, fractional)
      this.step = C.MUS_RATE / sampleRate;           // engine frames per output frame
      this.port.onmessage = (e) => {
        const m = e.data;
        if (m.type === 'note') this.engine.addNote(m.inst, m.midi, m.long, m.data);
        else if (m.type === 'forget') this.engine.forget(m.inst);
        else if (m.type === 'params') this.engine.p = m.p;
        else if (m.type === 'start') { this.engine.reset(); this.wi = 0; this.rp = 0; this.running = true; }
        else if (m.type === 'stop') { this.running = false; }
      };
    }
    process(inputs, outputs) {
      const out = outputs[0];
      const L = out[0];
      const R = out.length > 1 ? out[1] : out[0];
      const n = L.length;
      if (!this.running) { L.fill(0); if (R !== L) R.fill(0); return true; }
      const CAP = this.CAP;
      for (let i = 0; i < n; i++) {
        const i0 = Math.floor(this.rp);
        while (this.wi < i0 + 2) {
          const [bl, br] = this.engine.block();
          for (let j = 0; j < C.MUS_N; j++) {
            this.fl[(this.wi + j) % CAP] = bl[j];
            this.fr[(this.wi + j) % CAP] = br[j];
          }
          this.wi += C.MUS_N;
        }
        const fr = this.rp - i0;
        const a = i0 % CAP, b = (i0 + 1) % CAP;
        L[i] = this.fl[a] + (this.fl[b] - this.fl[a]) * fr;
        R[i] = this.fr[a] + (this.fr[b] - this.fr[a]) * fr;
        this.rp += this.step;
      }
      return true;
    }
  }
  registerProcessor('mahjong-music', MahjongMusic);
}

/* ---------------------------------------------------------------- MusicPlayer: what the game uses */
const MUSIC = MusicCommon();

class MusicPlayer {
  constructor(settings) {
    this.p = MUSIC.musicClean(settings);
    this.ctx = null;
    this.node = null;
    this.worker = null;
    this.analyser = null;
    this.running = false;
    this.error = '';
    this.have = new Set();
    this.haveInst = null;
    this.sig = null;
    this.starting = null;
    this.notesReady = 0;
  }

  get available() {
    return typeof window !== 'undefined' && !!(window.AudioContext || window.webkitAudioContext) &&
           !!window.AudioWorklet && !!window.Worker && !!window.Blob && !!(window.URL && URL.createObjectURL);
  }

  set(kw) {
    const q = Object.assign({}, this.p, kw);
    this.p = MUSIC.musicClean(q);
    if (this.running && this.node) {
      this.node.port.postMessage({ type: 'params', p: this.p });
      this.syncBank();
    }
  }

  syncBank() {
    const p = this.p;
    const sig = [p.inst, p.oct_lo, p.oct_n, p.long > 0].join('|');
    if (sig === this.sig) return;
    this.sig = sig;
    const order = MUSIC.musicPitches(p);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    let keys = order.map(m => [p.inst, m, false]);
    if (p.long > 0) keys = keys.concat(order.map(m => [p.inst, m, true]));
    if (this.haveInst !== p.inst) {                              // forget the other instruments
      this.have.clear();
      this.haveInst = p.inst;
      this.node.port.postMessage({ type: 'forget', inst: p.inst });
    }
    this.worker.postMessage({ cmd: 'want', keys: keys.filter(k => !this.have.has(MUSIC.noteKey(k[0], k[1], k[2]))) });
  }

  /* Must be called from a click or key press the first time (browsers only allow sound after one). */
  start() {
    if (!this.available) return Promise.resolve(false);
    if (this.running) return Promise.resolve(true);
    if (this.starting) return this.starting;
    const AC = window.AudioContext || window.webkitAudioContext;
    try {
      if (!this.ctx) {
        try { this.ctx = new AC({ sampleRate: MUSIC.MUS_RATE, latencyHint: 'playback' }); }
        catch (e) { this.ctx = new AC({ latencyHint: 'playback' }); }
      }
      const resumed = this.ctx.resume();
      this.error = '';
      this.starting = (async () => {
        try {
          await resumed;
          if (!this.node) {
            const src = MusicCommon.toString() + '\n(' + musicWorkletMain.toString() + ')(MusicCommon());';
            // A page opened straight from disk (file://) may not load blob: modules, so fall back to a data: URL.
            const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
            try { await this.ctx.audioWorklet.addModule(url); }
            catch (e1) { await this.ctx.audioWorklet.addModule('data:text/javascript;charset=utf-8,' + encodeURIComponent(src)); }
            URL.revokeObjectURL(url);
            this.node = new AudioWorkletNode(this.ctx, 'mahjong-music',
              { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2], processorOptions: { p: this.p } });
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 2048;
            this.node.connect(this.analyser);
            this.analyser.connect(this.ctx.destination);
            const wsrc = MusicCommon.toString() + '\n(' + musicWorkerMain.toString() + ')(MusicCommon());';
            const wurl = URL.createObjectURL(new Blob([wsrc], { type: 'text/javascript' }));
            this.worker = new Worker(wurl);
            URL.revokeObjectURL(wurl);
            this.worker.onmessage = (e) => {
              const m = e.data;
              if (m.inst !== this.p.inst) return;                // a note of an instrument no longer chosen
              this.have.add(MUSIC.noteKey(m.inst, m.midi, m.long));
              this.notesReady = this.have.size;
              this.node.port.postMessage({ type: 'note', inst: m.inst, midi: m.midi, long: m.long, data: m.data }, [m.data.buffer]);
            };
          }
          await this.ctx.resume();
          this.sig = null;
          this.node.port.postMessage({ type: 'params', p: this.p });
          this.node.port.postMessage({ type: 'start' });
          this.running = true;
          this.syncBank();
          return true;
        } catch (e) {
          this.error = String((e && e.message) || e);
          this.running = false;
          return false;
        } finally {
          this.starting = null;
        }
      })();
      return this.starting;
    } catch (e) {
      this.error = String((e && e.message) || e);
      return Promise.resolve(false);
    }
  }

  stop() {
    this.running = false;
    if (this.node) this.node.port.postMessage({ type: 'stop' });
    if (this.ctx && this.ctx.state === 'running') this.ctx.suspend();
  }
}

'use strict';
/* =====================================================================================================
   Mahjong Solitaire - screens, drawing and input (canvas). Everything on screen is a copy of the Python
   version: same positions, colours, buttons and hot keys. Browser differences: files are picked with the
   browser's file chooser and saved as downloads, settings live in localStorage, and QUIT is FULLSCREEN.
   ===================================================================================================== */

const FPS_FONT = 'Helvetica, Arial, sans-serif';
const FONT_K = 0.69;                         // pygame's default font size -> CSS pixels
const MIN_W = 1280, MIN_H = 720;             // below this the whole picture is scaled down to fit
const SETTINGS_KEY = 'mahjong_settings';
const NOTE_MS = 2800;

const MUS_ROWS = [
  ['Lowest octave', 'oct_lo', (v, p) => `${v}   (lowest note ${MUSIC.musicNoteName(MUSIC.musicPitches(p)[0])})`],
  ['Number of octaves', 'oct_n', (v, p) => { const a = MUSIC.musicPitches(p); return `${v}   (highest note ${MUSIC.musicNoteName(a[a.length - 1])})`; }],
  ['Note density', 'density', (v) => `${v} / 15   (aims for ${(1.0 / (9.0 * Math.pow(0.78, v - 1))).toFixed(1)} notes a second)`],
  ['Chance of long notes', 'long', (v) => `${v * 10} %`],
  ['Most notes at once', 'voices', (v) => `${v}`],
  ['Volume', 'vol', (v) => `${v} / 10`],
  null,
  ['Reverb amount', 'rev_mix', (v) => `${v} / 10`],
  ['Reverb length', 'rev_len', (v) => `${v} / 10`],
  ['Echo amount', 'dly_mix', (v) => `${v} / 10`],
  ['Echo time', 'dly_time', (v) => `${(0.12 + 0.075 * v).toFixed(2)} s`],
  ['Phaser amount', 'pha_mix', (v) => `${v} / 10`],
  ['Phaser speed', 'pha_rate', (v) => `${(0.05 + 0.09 * v).toFixed(2)} Hz`],
  ['Flanger amount', 'fla_mix', (v) => `${v} / 10`],
  ['Flanger speed', 'fla_rate', (v) => `${(0.04 + 0.05 * v).toFixed(2)} Hz`],
];

const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
const inRect = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; };

function loadSettings() {
  try { const d = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); return d && typeof d === 'object' ? d : {}; }
  catch (e) { return {}; }
}
function saveSettings(d) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(d)); } catch (e) { /* private mode */ } }

/* ---------------------------------------------------------------- browser file helpers */
function pickFiles(accept, multiple) {
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = accept || '';
    inp.multiple = !!multiple;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    const done = (files) => { inp.remove(); resolve(files); };
    inp.addEventListener('change', () => done(Array.from(inp.files || [])));
    inp.addEventListener('cancel', () => done([]));
    inp.click();
  });
}
function downloadText(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
const readText = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error); r.readAsText(file); });
const readDataUrl = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
const loadImage = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('not an image')); i.src = url; });

/* ---------------------------------------------------------------- pictures */
function imageToCanvas(img) {
  const c = makeCanvas(img.naturalWidth || img.width, img.naturalHeight || img.height);
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}
/* clockwise rotation (0/90/180/270) of a canvas */
function rotateCanvas(src, deg) {
  deg = ((deg % 360) + 360) % 360;
  if (!deg) return src;
  const sw = src.width, sh = src.height;
  const c = (deg === 180) ? makeCanvas(sw, sh) : makeCanvas(sh, sw);
  const g = c.getContext('2d');
  g.translate(c.width / 2, c.height / 2);
  g.rotate(deg * Math.PI / 180);
  g.drawImage(src, -sw / 2, -sh / 2);
  return c;
}

/* One picture in the tileset editor's gallery (max 18). */
class ImageEntry {
  constructor(name, base, dataUrl) {
    this.name = name;
    this.base = base;              // canvas, unrotated
    this.dataUrl = dataUrl;        // the original file, kept for SAVE
    this.rotation = 0;             // clockwise degrees
    this.crop = null;              // [x, y, w, h] in ROTATED-image coordinates
    this._rot = null;
    this._thumb = null;
  }
  surface() {
    if (this.rotation === 0) return this.base;
    if (!this._rot || this._rot[0] !== this.rotation) this._rot = [this.rotation, rotateCanvas(this.base, this.rotation)];
    return this._rot[1];
  }
  thumb(box) {
    const key = this.rotation + '|' + box;
    if (!this._thumb || this._thumb[0] !== key) {
      const s = this.surface();
      const f = Math.min(box / s.width, box / s.height);
      const c = makeCanvas(Math.max(1, Math.floor(s.width * f)), Math.max(1, Math.floor(s.height * f)));
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(s, 0, 0, c.width, c.height);
      this._thumb = [key, c];
    }
    return this._thumb[1];
  }
  /* rotate by a multiple of 90 (positive = clockwise); the crop box follows the picture */
  rotate(deltaCw) {
    const steps = (((deltaCw / 90) % 4) + 4) % 4;
    for (let i = 0; i < steps; i++) {
      const h = this.surface().height;
      if (this.crop) {
        const [x, y, cw, ch] = this.crop;
        this.crop = [h - (y + ch), x, ch, cw];
      }
      this.rotation = (this.rotation + 90) % 360;
    }
  }
}

/* One custom picture used for every tile of a kind+value. */
class CustomTile {
  constructor(kind, value, entry) {
    this.kind = kind; this.value = value;
    this.name = entry.name; this.dataUrl = entry.dataUrl;
    this.base = entry.base;
    this.crop = entry.crop ? entry.crop.slice() : null;
    this.rotation = entry.rotation || 0;
    this.surface = null;
  }
  load() {
    this.surface = null;
    try {
      let img = rotateCanvas(this.base, this.rotation);
      let sx = 0, sy = 0, sw = img.width, sh = img.height;
      if (this.crop) {
        let [x, y, w, h] = this.crop.map(Math.trunc);
        x = Math.max(0, Math.min(x, img.width - 1));
        y = Math.max(0, Math.min(y, img.height - 1));
        w = Math.max(1, Math.min(w, img.width - x));
        h = Math.max(1, Math.min(h, img.height - y));
        sx = x; sy = y; sw = w; sh = h;
      }
      const c = makeCanvas(TILE_W - TILE_INSET, TILE_H - TILE_INSET);
      const g = c.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
      this.surface = c;
      return true;
    } catch (e) { return false; }
  }
}

class Button {
  constructor(x, y, w, h, text, cb, size = 28, fill = null) {
    this.rect = { x, y, w, h };
    this.text = text; this.cb = cb; this.size = size; this.fill = fill;
  }
  draw(g, hov) {
    const r = this.rect;
    let col;
    if (this.fill) col = hov ? rgb(this.fill.map(c => Math.min(255, c + 28))) : rgb(this.fill);
    else col = hov ? 'rgb(110,110,160)' : 'rgb(80,80,120)';
    g.fillStyle = col;
    rrect(g, r.x, r.y, r.w, r.h, 8); g.fill();
    g.strokeStyle = 'rgb(255,215,60)'; g.lineWidth = 2;
    rrect(g, r.x + 1, r.y + 1, r.w - 2, r.h - 2, 7); g.stroke();
    text(g, this.text, r.x + r.w / 2, r.y + r.h / 2, this.size, '#fff', 'center');
  }
  click(x, y) { if (inRect(this.rect, x, y)) { if (this.cb) this.cb(); return true; } return false; }
}

function rrect(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
/* text: pygame font size -> CSS font; align left | center | midleft handled by 'align' */
function text(g, s, x, y, size, color, align, bold) {
  g.font = `${bold ? 'bold ' : ''}${Math.max(6, Math.round(size * FONT_K))}px ${FPS_FONT}`;
  g.fillStyle = color;
  g.textAlign = align === 'center' ? 'center' : 'left';
  g.textBaseline = 'middle';
  g.fillText(s, x, y);
}
function strokeInside(g, r, w, color, radius) {          // pygame draws a border inside the rectangle
  g.strokeStyle = color; g.lineWidth = w;
  rrect(g, r.x + w / 2, r.y + w / 2, r.w - w, r.h - w, Math.max(0, radius - w / 2)); g.stroke();
}
